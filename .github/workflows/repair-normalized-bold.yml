name: Repair Normalized Bold Boundaries

on:
  push:
    paths:
      - '.github/workflows/repair-normalized-bold.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair bold delimiters touched by normalizer
        shell: python
        run: |
          import pathlib
          import re

          files = '''
          README.md
          RESEARCH_RETROSPECTIVE.md
          research-notes/program-transformation-action-space.md
          action-credit/README.md
          action-credit/experiments/oracle-cases/README.md
          action-credit/results/2_1-11-47-clean-remeasurement.md
          action-credit/results/2_1-11-47-first-round.md
          action-credit/results/2_1-11-47-premeasurement.md
          action-credit/results/2_1-action-review.md
          action-credit/results/2_20-premeasurement.md
          action-credit/results/2_20-remeasurement.md
          action-credit/results/adaexplore-mlp.md
          action-credit/results/code-credit-protocol.md
          action-credit/results/code-first-pilot.md
          action-credit/results/implementation-ledger.md
          action-credit/results/oracle-credit-comparison.md
          action-credit/results/pilot.md
          action-credit/results/prospective-screen-2_1.md
          action-credit/results/screening-index-2026-09-25.md
          action-credit/results/source-audit.md
          cuda-skill-efficiency/README.md
          cuda-skill-efficiency/feasibility.md
          cuda-skill-efficiency/formal-protocol.md
          cuda-skill-efficiency/isolated-pilot.md
          cuda-skill-efficiency/materials.md
          cuda-skill-efficiency/opencode-pilot.md
          cuda-skill-efficiency/protocol.md
          cuda-skill-efficiency/results/formal-results.md
          cuda-skill-efficiency/results/traces/README.md
          '''.split()

          inline_code = re.compile(r'(`+)(.*?)\1')
          bold = re.compile(r'(?<![\*])\*\*(?!\*)(.+?)(?<![\*])\*\*(?!\*)')
          word = re.compile(r'\w')

          def repair_segment(segment: str) -> str:
              out = []
              cursor = 0
              for match in bold.finditer(segment):
                  prefix = segment[cursor:match.start()]
                  trimmed = match.group(1).strip()
                  if not trimmed:
                      continue
                  if match.start() > 0 and word.match(segment[match.start() - 1]) and not prefix.endswith((' ', '\t')):
                      prefix += ' '
                  out.append(prefix)
                  out.append(f'**{trimmed}**')
                  if match.end() < len(segment) and word.match(segment[match.end()]):
                      out.append(' ')
                  cursor = match.end()
              out.append(segment[cursor:])
              return ''.join(out)

          def repair_line(line: str) -> str:
              out = []
              cursor = 0
              for match in inline_code.finditer(line):
                  out.append(repair_segment(line[cursor:match.start()]))
                  out.append(match.group(0))
                  cursor = match.end()
              out.append(repair_segment(line[cursor:]))
              return ''.join(out)

          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              repaired = []
              fence = None
              for line in lines:
                  stripped = line.lstrip()
                  if fence:
                      repaired.append(line)
                      if stripped.startswith(fence):
                          fence = None
                      continue
                  if stripped.startswith('```'):
                      fence = '```'
                      repaired.append(line)
                      continue
                  if stripped.startswith('~~~'):
                      fence = '~~~'
                      repaired.append(line)
                      continue
                  repaired.append(repair_line(line))
              text = ''.join(repaired)
              if text != original:
                  path.write_text(text, encoding='utf-8')
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'clean: no bold repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md' '*.markdown'
          git commit -m 'fix: repair markdown bold boundaries [skip md-normalizer]'
          git push
